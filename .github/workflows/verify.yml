name: Verifica el Calendari Familiar

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instal·la TypeScript per al desenvolupament
        run: npm install --no-save --no-package-lock typescript@5.8.3
      - name: Compila el TypeScript
        run: npm run build
      - name: Extreu el JavaScript compilat per sincronitzar el web
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          text = base64.b64encode(Path("app.js").read_bytes()).decode("ascii")
          print("COMPILED_JS_BEGIN")
          for i in range(0, len(text), 3000):
              print("COMPILED_CHUNK:" + text[i:i+3000])
          print("COMPILED_JS_END")
          PY
      - name: Comprova la sintaxi del JavaScript
        run: node --check app.js
      - name: Executa les proves
        run: node --test tests/*.test.js
