name: Compila JS temporal per al treball de rotacions
on:
  push:
    branches: [feature/multi-rotations-v0610]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock typescript@5.8.3
      - run: npm run build
      - name: Sincronitza JS compilat
        run: |
          if ! git diff --quiet -- app.js; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app.js
            git commit -m 'build: sincronitza app.js amb TypeScript'
            git push
          fi
