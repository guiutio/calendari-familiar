<!doctype html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f7f8" />
  <script>
    (() => {
      try {
        const saved = localStorage.getItem('calendari-familiar-theme');
        const dark = saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#101722' : '#f6f7f8';
      } catch { /* La preferència es carregarà amb l'aplicació */ }
    })();
  </script>
  <meta name="description" content="Calendari Familiar: organitza les nits i les rotacions familiars de manera privada, també sense connexió." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Calendari Familiar" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="./assets/favicon.png" />
  <link rel="stylesheet" href="./styles.css?v=0.7.4" />
  <title>Calendari Familiar</title>
</head>
<body>
  <div id="app"><div class="loading-state">Carregant Calendari Familiar…</div></div>
  <script type="module" src="./scroll-guard.js?v=0.7.4"></script>
  <script src="./school-schedule-core.js?v=0.7.4"></script>
  <script src="./school-timeline.js?v=0.7.4"></script>
  <script src="./day-timeline.js?v=0.7.4"></script>
  <script src="./month-day-ui.js?v=0.7.4"></script>
  <script src="./rotation-patterns.js?v=0.7.4"></script>
  <script src="./rotation-editor.js?v=0.7.4"></script>
  <script type="module" src="./app.js?v=0.7.4"></script>
</body>
</html>
